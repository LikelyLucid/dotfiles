# Hermes skin generated by Wallust.
# The wallpaper palette is substituted into this file on every `wallust run`.

name: wallust
description: Wallust palette — unified dark Hermes theme

colors:
  # Base surfaces.
  background: "{{background}}"
  status_bar_bg: "{{color0}}"
  completion_menu_bg: "{{color0}}"
  completion_menu_meta_bg: "{{background}}"
  voice_status_bg: "{{color0}}"

  # Hermes structure, using Wallust's brighter terminal color for high-signal accents.
  banner_border: "{{color8}}"
  banner_title: "{{color7}}"
  banner_accent: "{{color7}}"
  banner_dim: "{{color8}}"
  banner_text: "{{foreground}}"
  ui_accent: "{{color7}}"
  ui_label: "{{cursor}}"
  ui_tool: "{{color7}}"
  ui_thinking: "{{cursor}}"

  # Keep status and syntax roles inside the generated Wallust palette.
  ui_ok: "{{color2}}"
  ui_error: "{{color1}}"
  ui_warn: "{{color3}}"
  syntax_string: "{{color2}}"
  syntax_number: "{{cursor}}"
  syntax_keyword: "{{color4}}"
  syntax_comment: "{{color8}}"

  # CLI/TUI chrome.
  prompt: "{{foreground}}"
  input_rule: "{{color7}}"
  response_border: "{{color7}}"
  status_bar_text: "{{foreground}}"
  status_bar_strong: "{{color7}}"
  status_bar_dim: "{{color8}}"
  status_bar_good: "{{color2}}"
  status_bar_warn: "{{color3}}"
  status_bar_bad: "{{color1}}"
  status_bar_critical: "{{color1}}"
  session_label: "{{cursor}}"
  session_border: "{{color8}}"
  shell_dollar: "{{cursor}}"

  # Completion and selection surfaces.
  completion_menu_current_bg: "{{cursor}}"
  completion_menu_meta_current_bg: "{{cursor}}"
  selection_bg: "{{cursor}}"

  # Diff colors stay deliberately restrained so they do not break the unified look.
  diff_added: "{{color0}}"
  diff_removed: "{{color0}}"
  diff_added_word: "{{color2}}"
  diff_removed_word: "{{color1}}"

# Keep the original Hermes identity and prompt language.
branding:
  agent_name: "Hermes Agent"
  prompt_symbol: "❯"
  help_header: "(^_^)? Available Commands"

tool_prefix: "┊"
